[project]
name = "codeflow-a2a-static-analysis-agent"
version = "1.0.0"
description = "A2A 1.0 Python/LangGraph static-analysis agent for the CodeFlow demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=1.0,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
codeflow-static-agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agent.py"]
