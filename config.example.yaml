# Copy this file to .codeflow/config.yaml. Keep real credentials in environment variables.
providers:
  - name: deepseek
    protocol: openai-compat
    base_url: https://api.deepseek.com
    api_key: "" # resolved from OPENAI_API_KEY
    model: deepseek-chat
    thinking: false
    context_window: 128000
    max_output_tokens: 8192

permission_mode: default
enable_coordinator_mode: false
enable_fork: true

# 默认 local 使用 .codeflow/tasks。多个 CodeFlow 进程共享任务时可改为
# postgres；URL/用户名/密码只从环境变量读取，不要写入配置文件。
durable_store:
  backend: local # local | postgres
  jdbc_url_env: CODEFLOW_POSTGRES_URL
  username_env: CODEFLOW_POSTGRES_USER
  password_env: CODEFLOW_POSTGRES_PASSWORD
  schema: codeflow
  lease_seconds: 60

# Start examples/a2a-static-analysis-agent before enabling this remote Agent.
a2a_agents:
  - name: static-analysis
    card_url: http://localhost:8001/.well-known/agent-card.json
    timeout_seconds: 120
    poll_interval_ms: 500
    enabled: true

context_policy:
  enabled: true
  strategy: hybrid # lexical | vector | hybrid
  lexical_weight: 0.65
  vector_weight: 0.35
  max_tool_schemas: 24
  max_schema_chars: 30000
  max_memory_chars: 12000
  embedding:
    enabled: true
    provider: local # local | openai-compatible
    dimensions: 384
    # base_url: https://api.openai.com/v1
    # model: text-embedding-3-small
    # api_key_env: OPENAI_API_KEY
    # timeout_seconds: 10

