name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew test
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test
      - name: Build executable JAR (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew shadowJar
      - name: Build executable JAR (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat shadowJar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test

  agent-harness-e2e:
    name: A2A + Durable + Context E2E
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/a2a-static-analysis-agent/pyproject.toml
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Python Agent and recorder
        run: python -m pip install -e "examples/a2a-static-analysis-agent[recording]"
      - name: Run Agent Harness end-to-end validation
        run: python scripts/record_e2e_demo.py
      - name: Upload validation evidence
        uses: actions/upload-artifact@v6
        with:
          name: agent-harness-e2e-evidence
          path: |
            docs/VALIDATION.md
            docs/validation/latest.json
            docs/BENCHMARK.md
            docs/benchmarks/context-ablation.json
            docs/assets/codeflow-demo.gif
